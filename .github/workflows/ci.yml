name: CI

on:
  # Every branch push, so feature branches get Windows/Linux/macOS results before
  # being merged locally (no PR needed). Tags are not matched; releases use release.yml.
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No job writes to the repository; uploading artifacts and the cache need no token permission.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Configure CMake
        # The core's developer log off: ctest's capture of its output doubled the Windows test step (the Linux jobs keep
        # it on, so test_dev_log still runs)
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBRIMIR_BUILD_TESTS=ON -DBrimir_ENABLE_DEVLOG=OFF

      - name: Build
        run: cmake --build build --target brimir_libretro brimir_tests brimir_bench brimir_vkhost --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  test-linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DBRIMIR_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --target brimir_libretro brimir_tests brimir_bench brimir_vkhost --parallel $(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # The JIT tests under ThreadSanitizer: the compile worker thread against the emulation thread
  # (milestone 2E). Upstream's threaded VDP races are suppressed in tests/tsan_suppressions.txt.
  test-linux-tsan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build

      # ThreadSanitizer aborts with "unexpected memory mapping" when the kernel's ASLR entropy is
      # above what it supports; the runner image's default is.
      - name: Lower ASLR entropy for ThreadSanitizer
        run: sudo sysctl vm.mmap_rnd_bits=28

      # Also the BRIMIR_VULKAN=OFF build check (brimir_libretro and brimir_tests): the JIT tests don't touch the GPU
      # renderer.
      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_FLAGS=-fsanitize=thread \
            -DCMAKE_C_FLAGS=-fsanitize=thread \
            -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread \
            -DBRIMIR_BUILD_TESTS=ON \
            -DBRIMIR_VULKAN=OFF

      - name: Build
        run: cmake --build build --target brimir_libretro brimir_tests --parallel $(nproc)

      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1 suppressions=${{ github.workspace }}/tests/tsan_suppressions.txt
        run: ./build/bin/brimir_tests "[jit]"

      # No suppressions file: the VDP1 TVMD race fix (each VDP1 command and erase uses the TVMD of the emulation thread
      # at issue time) must stay race free. Before the fix this reported 4 TVMD/VRes races (evidence task5c,
      # fr1-tsan-nosupp-tvmd-prefix.txt), after it none. Other threaded VDP races are not fixed: only [tvmd] is filtered.
      - name: Test the VDP1 TVMD fix without suppressions
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: ./build/bin/brimir_tests "[tvmd]"

  # The [gpu] tests on Mesa's lavapipe (software Vulkan) with the Khronos validation layer: headless device, compute
  # helpers, zero validation errors. BRIMIR_REQUIRE_VULKAN=1 makes a missing device or layer fail instead of SKIP.
  # "[gpu]" also selects the hidden [gpu] cases, among them the long VDP1 fuzz run (seeds 1-1000), most of the time.
  # Two shards on separate runners: 1 = every [gpu] case but the long fuzz run, plus its seeds 1-450; 2 = seeds
  # 451-1000, plus every VDP2 scene again with VDP1 on the GPU. Together exactly the one-job set. CI run 41596579632
  # (one job, 4 vCPUs): build 7 min, [gpu] without the long run 14 min, the long run 68 min, the VDP2 scenes with VDP1
  # on the GPU 10 min; so about 52 and 54 min per shard.
  gpu-lavapipe:
    name: gpu-lavapipe (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            fuzz-first: 1
            fuzz-seeds: 450
          - shard: 2
            fuzz-first: 451
            fuzz-seeds: 550
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            libvulkan1 mesa-vulkan-drivers vulkan-validationlayers

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DBRIMIR_BUILD_TESTS=ON \
            -DBRIMIR_VULKAN=ON

      - name: Build
        run: cmake --build build --target brimir_tests --parallel $(nproc)

      # The manifest is lvp_icd.json in noble-updates' Mesa (lvp_icd.<arch>.json in some older packages).
      - name: Test
        if: matrix.shard == 1
        env:
          BRIMIR_REQUIRE_VULKAN: 1
        run: |
          export VK_DRIVER_FILES="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)"
          echo "VK_DRIVER_FILES=$VK_DRIVER_FILES"
          ./build/bin/brimir_tests "[gpu]~[vdp1-fuzz-long]"

      - name: Test the long VDP1 fuzz run (${{ matrix.fuzz-seeds }} seeds from ${{ matrix.fuzz-first }})
        env:
          BRIMIR_REQUIRE_VULKAN: 1
          BRIMIR_VDP1_FUZZ_FIRST: ${{ matrix.fuzz-first }}
          BRIMIR_VDP1_FUZZ_SEEDS: ${{ matrix.fuzz-seeds }}
        run: |
          export VK_DRIVER_FILES="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)"
          echo "VK_DRIVER_FILES=$VK_DRIVER_FILES"
          ./build/bin/brimir_tests "[vdp1-fuzz-long]"

      # Every VDP2 scene again with VDP1 on the GPU (RenderBoth's BRIMIR_VDP1_MODE).
      - name: Test VDP2 scenes with VDP1 on the GPU
        if: matrix.shard == 2
        env:
          BRIMIR_REQUIRE_VULKAN: 1
          BRIMIR_VDP1_MODE: gpu
        run: |
          export VK_DRIVER_FILES="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)"
          echo "VK_DRIVER_FILES=$VK_DRIVER_FILES"
          ./build/bin/brimir_tests "[gpu][vdp2][scene]"

  # The committed SPIR-V and layout headers (src/gpu/shaders/generated) must match the HLSL sources. Uses DXC,
  # spirv-val and spirv-cross from the LunarG Vulkan SDK the headers were generated with; the build jobs never need the
  # SDK.
  shaders-check:
    runs-on: ubuntu-24.04
    env:
      VULKAN_SDK_VERSION: 1.4.363.0
    steps:
      - uses: actions/checkout@v4

      - name: Cache Vulkan SDK shader tools
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vulkansdk
          key: vulkansdk-shader-tools-v2-linux-x86_64-${{ env.VULKAN_SDK_VERSION }}

      - name: Download Vulkan SDK shader tools
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/vulkansdk.tar.xz" \
            "https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/linux/vulkansdk-linux-x86_64-${VULKAN_SDK_VERSION}.tar.xz"
          mkdir -p "$RUNNER_TEMP/vulkansdk"
          tar -xJf "$RUNNER_TEMP/vulkansdk.tar.xz" -C "$RUNNER_TEMP/vulkansdk" --wildcards \
            '*/x86_64/bin/dxc*' '*/x86_64/bin/spirv-val' '*/x86_64/bin/spirv-cross' '*/x86_64/lib/libdxcompiler.so*'
          rm "$RUNNER_TEMP/vulkansdk.tar.xz"

      - name: Check generated shader headers
        run: |
          export VULKAN_SDK="$RUNNER_TEMP/vulkansdk/${VULKAN_SDK_VERSION}/x86_64"
          cmake -DBRIMIR_SHADERS_CHECK=ON -P tools/shaders/build_shaders.cmake

  # The Android core for arm64-v8a (the shipped ABI), built, checked and packaged as release.yml does
  # (tools/android/README.md). The NDK is the pinned one (tools/android/ndk-version.txt) from the runner's SDK: the
  # runner's ANDROID_NDK_HOME is another version, so build.sh notes that and uses $ANDROID_HOME/ndk/<pin>.
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build zip unzip file

      - name: Release text guard
        run: bash tools/android/check_release_text.sh tools/android/ANDROID-INSTALL.txt "$GITHUB_REF"

      - name: Pinned Android NDK
        run: |
          pin=$(tr -d '[:space:]' < tools/android/ndk-version.txt)
          echo "pin $pin; ANDROID_HOME=$ANDROID_HOME; ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-unset}"
          ls "$ANDROID_HOME/ndk" || true
          if [ ! -f "$ANDROID_HOME/ndk/$pin/source.properties" ]; then
            echo "NDK $pin is not on the runner: installing it"
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$pin" > /dev/null
          fi
          grep Pkg.Revision "$ANDROID_HOME/ndk/$pin/source.properties"

      - name: Build the arm64-v8a core
        run: bash tools/android/build.sh arm64-v8a

      # Only for test_check_elf.sh: a real Linux x64 core must fail the arm64-v8a checks.
      - name: Build a Linux x64 core
        run: |
          cmake -B build-host -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DBRIMIR_BUILD_TESTS=OFF
          cmake --build build-host --target brimir_libretro --parallel $(nproc)

      - name: Check the core
        run: bash tools/android/check_elf.sh build-android-arm64-v8a/lib/brimir_libretro_android.so arm64-v8a

      - name: Package
        run: |
          mkdir -p dist/stripped
          bash tools/android/package.sh build-android-arm64-v8a/lib/brimir_libretro_android.so \
            dist/brimir-android-arm64.zip
          unzip -l dist/brimir-android-arm64.zip
          unzip -q dist/brimir-android-arm64.zip brimir_libretro_android.so -d dist/stripped
          file build-android-arm64-v8a/lib/brimir_libretro_android.so dist/stripped/brimir_libretro_android.so
          sha256sum build-android-arm64-v8a/lib/brimir_libretro_android.so dist/stripped/brimir_libretro_android.so \
            dist/brimir-android-arm64.zip

      - name: Check the packaged (stripped) core
        run: bash tools/android/check_elf.sh dist/stripped/brimir_libretro_android.so arm64-v8a

      - name: Test the Android scripts
        env:
          HOST_CORE: build-host/lib/brimir_libretro.so
          X86_64_CORE: "skip:the x86_64 core is built and checked in android-emulator-tests"
        run: |
          bash tools/android/test_check_elf.sh
          bash tools/android/test_package.sh
          bash tools/android/test_check_release_text.sh

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: brimir-android-arm64
          path: dist/brimir-android-arm64.zip
          if-no-files-found: error
          retention-days: 14

      # Same build-id as the packaged core: for symbolicating crash reports.
      - name: Upload the unstripped core
        uses: actions/upload-artifact@v4
        with:
          name: brimir-android-arm64-unstripped
          path: build-android-arm64-v8a/lib/brimir_libretro_android.so
          if-no-files-found: error
          retention-days: 14

  # brimir_tests on an x86_64 Android emulator (API 34, google_apis), no BIOS (the BIOS cases skip), no GPU cases
  # (~[gpu]); tools/android/emulator_tests.sh copies the binary and tests/fixtures to /data/local/tmp/brimir. Not a
  # dependency of the release.
  android-emulator-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build

      - name: Pinned Android NDK
        run: |
          pin=$(tr -d '[:space:]' < tools/android/ndk-version.txt)
          echo "pin $pin; ANDROID_HOME=$ANDROID_HOME; ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-unset}"
          ls "$ANDROID_HOME/ndk" || true
          if [ ! -f "$ANDROID_HOME/ndk/$pin/source.properties" ]; then
            echo "NDK $pin is not on the runner: installing it"
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$pin" > /dev/null
          fi
          grep Pkg.Revision "$ANDROID_HOME/ndk/$pin/source.properties"

      - name: Build the x86_64 core and tests
        run: bash tools/android/build.sh x86_64 --tests

      - name: Check the x86_64 core
        run: bash tools/android/check_elf.sh build-android-x86_64/lib/brimir_libretro_android.so x86_64

      # As documented by reactivecircus/android-emulator-runner: hardware acceleration for the emulator.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Unit tests on the Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash tools/android/emulator_tests.sh build-android-x86_64/bin/brimir_tests "~[gpu]"

  build-macos-arm64:
    # macos-14 is retired on 2026-11-02 (deprecated since 2026-07-06, with brownouts that
    # leave jobs queued or failing). Builds keep targeting macOS 14 as before.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install ninja

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DBRIMIR_BUILD_TESTS=ON \
            -DBrimir_ENABLE_DEVLOG=OFF

      - name: Build
        run: cmake --build build --target brimir_libretro brimir_tests brimir_bench brimir_vkhost --parallel $(sysctl -n hw.ncpu)

      - name: Test
        run: ctest --test-dir build --output-on-failure
