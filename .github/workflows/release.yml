name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBRIMIR_LTO=ON

      - name: Build
        run: cmake --build build --config Release --target brimir_libretro --parallel

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p artifact
          cp build/bin/brimir_libretro.dll artifact/
          cp resources/info/brimir_libretro.info artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: brimir-windows-x64
          path: artifact/

  build-linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DBRIMIR_LTO=ON

      - name: Build
        run: cmake --build build --config Release --target brimir_libretro --parallel $(nproc)

      - name: Prepare artifact
        run: |
          mkdir -p artifact
          find build -name "brimir_libretro.so" -exec cp {} artifact/ \;
          cp resources/info/brimir_libretro.info artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: brimir-linux-x64
          path: artifact/

  build-linux-arm64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM64 cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            gcc-14-aarch64-linux-gnu g++-14-aarch64-linux-gnu

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc-14 \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++-14 \
            -DBRIMIR_LTO=ON

      - name: Build
        run: cmake --build build --config Release --target brimir_libretro --parallel $(nproc)

      - name: Prepare artifact
        run: |
          mkdir -p artifact
          find build -name "brimir_libretro.so" -exec cp {} artifact/ \;
          cp resources/info/brimir_libretro.info artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: brimir-linux-arm64
          path: artifact/

  build-macos-arm64:
    # macos-14 is retired on 2026-11-02 (deprecated since 2026-07-06, with brownouts that
    # leave jobs queued or failing). The core keeps targeting macOS 14, as releases did when
    # they were built on macos-14, so users on macOS 14 can still load it.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake ninja

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DBRIMIR_LTO=ON

      - name: Build
        run: cmake --build build --config Release --target brimir_libretro --parallel $(sysctl -n hw.ncpu)

      - name: Prepare artifact
        run: |
          mkdir -p artifact
          find build -name "brimir_libretro.*" -exec cp {} artifact/ \;
          cp resources/info/brimir_libretro.info artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: brimir-macos-arm64
          path: artifact/

  # The Android core (arm64-v8a), as ci.yml's build-android (tools/android/README.md) but without the Linux x64 core that
  # only serves a test case. A dry run (started by hand, no tag) uploads brimir-android-arm64: the phone test build.
  build-android-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build zip unzip file

      # Fails a tag build while ANDROID-INSTALL.txt still says "in testing"; a dry run passes (the release job checks
      # again).
      - name: Release text guard
        run: bash tools/android/check_release_text.sh tools/android/ANDROID-INSTALL.txt "$GITHUB_REF"

      - name: Pinned Android NDK
        run: |
          pin=$(tr -d '[:space:]' < tools/android/ndk-version.txt)
          echo "pin $pin; ANDROID_HOME=$ANDROID_HOME; ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-unset}"
          ls "$ANDROID_HOME/ndk" || true
          if [ ! -f "$ANDROID_HOME/ndk/$pin/source.properties" ]; then
            echo "NDK $pin is not on the runner: installing it"
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$pin" > /dev/null
          fi
          grep Pkg.Revision "$ANDROID_HOME/ndk/$pin/source.properties"

      - name: Build the arm64-v8a core
        run: bash tools/android/build.sh arm64-v8a

      - name: Check the core
        run: bash tools/android/check_elf.sh build-android-arm64-v8a/lib/brimir_libretro_android.so arm64-v8a

      - name: Package
        run: |
          mkdir -p dist/stripped
          bash tools/android/package.sh build-android-arm64-v8a/lib/brimir_libretro_android.so \
            dist/brimir-android-arm64.zip
          unzip -l dist/brimir-android-arm64.zip
          unzip -q dist/brimir-android-arm64.zip brimir_libretro_android.so -d dist/stripped
          file build-android-arm64-v8a/lib/brimir_libretro_android.so dist/stripped/brimir_libretro_android.so
          sha256sum build-android-arm64-v8a/lib/brimir_libretro_android.so dist/stripped/brimir_libretro_android.so \
            dist/brimir-android-arm64.zip

      - name: Check the packaged (stripped) core
        run: bash tools/android/check_elf.sh dist/stripped/brimir_libretro_android.so arm64-v8a

      - name: Test the Android scripts
        env:
          HOST_CORE: "skip:no Linux x64 core in the release build (ci.yml's build-android runs this case)"
          X86_64_CORE: "skip:the x86_64 core is not released (ci.yml's android-emulator-tests checks it)"
        run: |
          bash tools/android/test_check_elf.sh
          bash tools/android/test_package.sh
          bash tools/android/test_check_release_text.sh

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: brimir-android-arm64
          path: dist/brimir-android-arm64.zip
          if-no-files-found: error

      # Same build-id as the packaged core: for symbolicating crash reports.
      - name: Upload the unstripped core
        uses: actions/upload-artifact@v4
        with:
          name: brimir-android-arm64-unstripped
          path: build-android-arm64-v8a/lib/brimir_libretro_android.so
          if-no-files-found: error

  release:
    needs: [build-windows, build-linux-x64, build-linux-arm64, build-macos-arm64, build-android-arm64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Android release text guard
        run: bash tools/android/check_release_text.sh tools/android/ANDROID-INSTALL.txt "$GITHUB_REF"

      - name: Download Windows x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: brimir-windows-x64
          path: windows-x64

      - name: Download Linux x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: brimir-linux-x64
          path: linux-x64

      - name: Download Linux ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: brimir-linux-arm64
          path: linux-arm64

      - name: Download macOS ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: brimir-macos-arm64
          path: macos-arm64

      - name: Download Android ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: brimir-android-arm64
          path: android-arm64

      # The Android zip is the one package.sh made (tools/android/package.sh), only renamed.
      - name: Package releases
        run: |
          cd windows-x64 && zip -r ../brimir-${{ github.ref_name }}-windows-x64.zip . && cd ..
          cd linux-x64 && tar czf ../brimir-${{ github.ref_name }}-linux-x64.tar.gz . && cd ..
          cd linux-arm64 && tar czf ../brimir-${{ github.ref_name }}-linux-arm64.tar.gz . && cd ..
          cd macos-arm64 && tar czf ../brimir-${{ github.ref_name }}-macos-arm64.tar.gz . && cd ..
          cp android-arm64/brimir-android-arm64.zip brimir-${{ github.ref_name }}-android-arm64.zip
          unzip -l brimir-${{ github.ref_name }}-android-arm64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            brimir-${{ github.ref_name }}-windows-x64.zip
            brimir-${{ github.ref_name }}-linux-x64.tar.gz
            brimir-${{ github.ref_name }}-linux-arm64.tar.gz
            brimir-${{ github.ref_name }}-macos-arm64.tar.gz
            brimir-${{ github.ref_name }}-android-arm64.zip
          body: |
            Brimir is a Sega Saturn emulation core for libretro, built on Ymir's cycle-accurate hardware layer.

            ### ${{ github.ref_name }}

            **Fixed** - run-ahead with "Use Second Instance" and the Vulkan renderer gave sound but a black picture: RetroArch shows the second instance's frames, and a second copy of the core cannot get the Vulkan context the first one holds. The second copy now declines to load, and RetroArch runs run-ahead on one instance, with the picture. It shows "Failed to create second instance. Run-Ahead will now use only one instance." once per content load. This applies with `brimir_renderer` = `vulkan` on RetroArch's `vulkan` video driver; the software renderer keeps the second instance.

            **No other change** - frames, audio and save states are identical to 0.8.0 (checked per frame on 9 windows with and without threaded VDP, and through the libretro core with the software and Vulkan renderers, including run-ahead).

            **Run-ahead tip** - each run-ahead frame costs a whole emulated frame plus a state save and load; 1 frame is the practical setting in demanding games.

            **Known Limitations**
            - Vulkan at 4x: Daytona USA CE's SEGA logo and attract-mode restart stutter; rotated or distorted sprites (e.g. Astal) may differ from 1x at their edges; magnified textures stay blocky. Not tested on real Macs (MoltenVK). CD Block low-level emulation is tested on six contents only.
            - Interlaced / high-res titles (e.g., *Virtua Fighter 2*) may still show audio dropouts on CPU-bound setups when deinterlacing is enabled. Use Deinterlacing Mode = `None` for the best performance in these titles.

            See [CHANGELOG.md](https://github.com/coredds/brimir/blob/master/CHANGELOG.md) for full details.
