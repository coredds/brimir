name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBRIMIR_LTO=ON

      - name: Build
        run: cmake --build build --config Release --target brimir_libretro --parallel

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p artifact
          cp build/bin/brimir_libretro.dll artifact/
          cp resources/info/brimir_libretro.info artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: brimir-windows-x64
          path: artifact/

  build-linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DBRIMIR_LTO=ON

      - name: Build
        run: cmake --build build --config Release --target brimir_libretro --parallel $(nproc)

      - name: Prepare artifact
        run: |
          mkdir -p artifact
          find build -name "brimir_libretro.so" -exec cp {} artifact/ \;
          cp resources/info/brimir_libretro.info artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: brimir-linux-x64
          path: artifact/

  build-linux-arm64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM64 cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            gcc-14-aarch64-linux-gnu g++-14-aarch64-linux-gnu

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc-14 \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++-14 \
            -DBRIMIR_LTO=ON

      - name: Build
        run: cmake --build build --config Release --target brimir_libretro --parallel $(nproc)

      - name: Prepare artifact
        run: |
          mkdir -p artifact
          find build -name "brimir_libretro.so" -exec cp {} artifact/ \;
          cp resources/info/brimir_libretro.info artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: brimir-linux-arm64
          path: artifact/

  build-macos-arm64:
    # macos-14 is retired on 2026-11-02 (deprecated since 2026-07-06, with brownouts that
    # leave jobs queued or failing). The core keeps targeting macOS 14, as releases did when
    # they were built on macos-14, so users on macOS 14 can still load it.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake ninja

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DBRIMIR_LTO=ON

      - name: Build
        run: cmake --build build --config Release --target brimir_libretro --parallel $(sysctl -n hw.ncpu)

      - name: Prepare artifact
        run: |
          mkdir -p artifact
          find build -name "brimir_libretro.*" -exec cp {} artifact/ \;
          cp resources/info/brimir_libretro.info artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: brimir-macos-arm64
          path: artifact/

  release:
    needs: [build-windows, build-linux-x64, build-linux-arm64, build-macos-arm64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: brimir-windows-x64
          path: windows-x64

      - name: Download Linux x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: brimir-linux-x64
          path: linux-x64

      - name: Download Linux ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: brimir-linux-arm64
          path: linux-arm64

      - name: Download macOS ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: brimir-macos-arm64
          path: macos-arm64

      - name: Package releases
        run: |
          cd windows-x64 && zip -r ../brimir-${{ github.ref_name }}-windows-x64.zip . && cd ..
          cd linux-x64 && tar czf ../brimir-${{ github.ref_name }}-linux-x64.tar.gz . && cd ..
          cd linux-arm64 && tar czf ../brimir-${{ github.ref_name }}-linux-arm64.tar.gz . && cd ..
          cd macos-arm64 && tar czf ../brimir-${{ github.ref_name }}-macos-arm64.tar.gz . && cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            brimir-${{ github.ref_name }}-windows-x64.zip
            brimir-${{ github.ref_name }}-linux-x64.tar.gz
            brimir-${{ github.ref_name }}-linux-arm64.tar.gz
            brimir-${{ github.ref_name }}-macos-arm64.tar.gz
          body: |
            Brimir is a Sega Saturn emulation core for libretro, built on Ymir's cycle-accurate hardware layer.

            ### ${{ github.ref_name }}

            **Performance** - the software renderer and the SH-2 interpreter are much faster, with byte-identical output. Median frame time on 9 test windows (BIOS menu and eight games), against 0.7.2: 20-64 % shorter with threaded VDP (the default) and 29-61 % shorter without it, on every window. Examples with threaded VDP: Virtua Fighter 2 18.4 -> 6.7 ms, Fighters Megamix 17.6 -> 6.9 ms, Street Fighter Zero 3 11.1 -> 4.8 ms. The Vulkan renderer at 1x is 7-9 % faster, and a single-instance run-ahead frame 23-39 % cheaper.
            - VDP2 backgrounds drawn per character run; sprite layer skips empty 8-dot blocks; layer compose vectorised (SSE2 / NEON).
            - Leaner SH-2 interpreter (inlined hot path, RAM/ROM fast path); the core's forced-inline hints are now active.
            - Run-ahead reuses the state it just saved instead of decoding it again.
            - Threaded VDP1: less emulation-thread time (the render thread's counter has its own cache line).

            **No output change** - frames, audio, save-state bytes and cycle counts are identical to 0.7.2. Checked per frame on all 9 windows with and without threaded VDP, through the libretro core with the software and Vulkan renderers (plain, save/load every frame, run-ahead), on the aarch64 build, with the 40 software-vs-Vulkan compare runs and the JIT lockstep check. States from 0.7.2 and older load as before.

            Timings are from Windows (MSVC, Ryzen 7 5700G); Linux and macOS builds got faster in the same direction but were not re-measured at the end. In threaded mode, the deinterlacer hand-off spins briefly before blocking on CPUs with 4 or more hardware threads (timing only).

            **Known Limitations**
            - Vulkan at 4x: Daytona USA CE's SEGA logo and attract-mode restart stutter; rotated or distorted sprites (e.g. Astal) may differ from 1x at their edges; magnified textures stay blocky. Not tested on real Macs (MoltenVK). CD Block low-level emulation is tested on six contents only.
            - Interlaced / high-res titles (e.g., *Virtua Fighter 2*) may still show audio dropouts on CPU-bound setups when deinterlacing is enabled. Use Deinterlacing Mode = `None` for the best performance in these titles.

            See [CHANGELOG.md](https://github.com/coredds/brimir/blob/master/CHANGELOG.md) for full details.
